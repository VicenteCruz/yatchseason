<!-- ============ WELCOME VIDEO ============ -->
<section id="welcome" class="welcome-section">
  <div class="container">
    <div class="welcome-content reveal">
      <h2 class="welcome-title">Bem-vindos às <span class="highlight-text">melhores férias</span> do teu verão</h2>
      <p class="welcome-subtitle">Num catamarã privado para ti e os teus amigos, no meio do Mediterrâneo.</p>
    </div>
    
    <div class="video-container reveal-scale">
      <div class="video-wrapper">
        <!-- Substituir por <video> ou <iframe> real depois -->
        <div class="video-placeholder" style="background-image: url('img/gallery_1.jpg');">
          <div class="video-overlay"></div>
          <button class="play-button magnetic" aria-label="Play video">
            <div class="play-icon">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 5.14v14l11-7-11-7z"/>
              </svg>
            </div>
          </button>
          <div class="video-text">Ver o Teaser</div>
        </div>
      </div>
      
      <!-- Elementos decorativos (vibe jovem) -->
      <div class="floating-badge badge-1" data-speed="0.05">🛥️ Exclusivo</div>
      <div class="floating-badge badge-2" data-speed="-0.03">🌊 Água Quente</div>
      <div class="floating-badge badge-3" data-speed="0.04">🎉 Vibes</div>
    </div>
  </div>
</section>
